name: Auto Sync MoonTVPlus 每6小时自动同步
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置Git身份
        run: |
          git config user.name "AutoSyncBot"
          git config user.email "dkest@qq.com"

      - name: 添加上游并拉取全量代码
        run: |
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git || true
          git fetch upstream main

      # 1. 本地强制完全同步为上游最新，清除所有本地差异/冲突
      - name: 硬重置到上游main
        run: |
          git reset --hard upstream/main
          git clean -fd

      # 2. 恢复你自己的同步脚本，避免被重置删除
      - name: 恢复auto-sync.yml
        run: |
          git checkout origin/main -- .github/workflows/auto-sync.yml || true

      # 3. 清理所有外来 workflow 文件，只保留自身脚本
      - name: 过滤多余工作流
        run: |
          find .github/workflows -type f ! -name 'auto-sync.yml' -delete
          git add .

      # 4. 提交变更
      - name: 提交本地修改
        run: |
          git commit -m "sync upstream source" || echo "No changes to commit"

      # 5. 强制推送，解决 non-fast-forward 分支落后报错
      - name: 强制推送到远程
        run: |
          git push origin main --force

      # 兜底触发Vercel部署
      - name: 触发Vercel部署Hook
        if: success()
        run: |
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_qvkM9wqMZ3yjqodv2hZnoiqsqAJd/Ax6VpFiTwJ"
