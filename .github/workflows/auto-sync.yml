name: Auto Sync MoonTVPlus 每12小时自动同步

on:
  schedule:
    - cron: '0 10,22 * * *'  # 北京时间 18:00 和次日 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 配置Git身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 添加上游并拉取全量代码
        run: |
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git || true
          git fetch upstream main

      - name: 合并上游 main（排除 workflow 目录）
        run: |
          # 记录本地 workflow 目录快照，供合并后回退
          cp -r .github/workflows /tmp/workflows_backup 2>/dev/null || true
          git merge upstream/main --no-commit --no-edit -X ours || true
          # 关键：把 workflow 目录整体回退到合并前状态，避免上游新增文件进入本次提交
          rm -rf .github/workflows
          cp -r /tmp/workflows_backup .github/workflows 2>/dev/null || mkdir -p .github/workflows
          git add -A .github/workflows
          # 显式恢复自己的配置文件，确保不被上游覆盖
          git checkout origin/main -- next.config.js 2>/dev/null || true
          git checkout origin/main -- vercel.json 2>/dev/null || true
          git add -A
          git commit -m "chore: sync upstream, exclude workflow dir" || true

      - name: 校验 workflow 目录无上游变更
        run: |
          # 若检测到除 auto-sync.yml 外的文件，直接终止，避免推送被拒
          EXTRA=$(ls .github/workflows 2>/dev/null | grep -v '^auto-sync.yml$' || true)
          if [ -n "$EXTRA" ]; then
            echo "检测到非预期 workflow 文件: $EXTRA"
            exit 1
          fi
          echo "workflow 目录校验通过"

      - name: 推送代码到主分支
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: true

      - name: 触发 Vercel 部署
        run: |
          echo "正在触发 Vercel Deploy Hook..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.vercel.com/v1/integrations/deploy/prj_qvkM9wqMZ3yjqodv2hZnoiqsqAJd/Ax6VpFiTwJ")
          echo "HTTP状态码: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "警告: Vercel Hook 返回异常状态码 $HTTP_CODE，请检查 Hook URL 是否有效"
          fi
        continue-on-error: true
