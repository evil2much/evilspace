name: Auto Sync MoonTVPlus 每6小时自动同步

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 配置Git身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游并拉取全量代码
        run: |
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git || true
          git fetch upstream main

      - name: 合并上游 main（保留自身修改）
        run: |
          git merge upstream/main --no-edit -X ours || true
          # 显式恢复自己的配置文件，确保不被上游覆盖
          git checkout origin/main -- .github/workflows/auto-sync.yml 2>/dev/null || true
          git checkout origin/main -- next.config.js 2>/dev/null || true
          git checkout origin/main -- vercel.json 2>/dev/null || true
          git add .
          git commit -m "sync upstream (merge)" || echo "No changes to commit"

      - name: 清理多余工作流文件
        run: |
          find .github/workflows -type f ! -name 'auto-sync.yml' -delete 2>/dev/null || true
          git add .
          git commit -m "clean extra workflows" || echo "No changes"

      - name: 推送到远程
        run: |
          git push origin main --force-with-lease

      - name: 触发Vercel部署Hook
        if: success()
        run: |
          curl -X POST \
            --max-time 30 \
            --retry 2 \
            "https://api.vercel.com/v1/integrations/deploy/prj_qvkM9wqMZ3yjqodv2hZnoiqsqAJd/Ax6VpFiTwJ"
