
name: Auto Sync MoonTVPlus

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 配置Git身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游并拉取
        run: |
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git || true
          git fetch upstream main

      - name: 合并上游main（保留自身修改）
        run: |
          git checkout main
          git merge upstream/main --no-edit -X ours || git merge --abort

      - name: 恢复自身配置文件
        run: |
          git checkout origin/main -- next.config.js vercel.json .github/workflows/auto-sync.yml 2>/dev/null || true
          git add next.config.js vercel.json .github/workflows/auto-sync.yml

      - name: 清理多余工作流
        run: |
          find .github/workflows -type f ! -name 'auto-sync.yml' -delete 2>/dev/null || true
          git add .

      - name: 提交变更
        run: |
          git commit -m "sync upstream source" || echo "No changes to commit"

      - name: 推送
        run: |
          git push origin main --force-with-lease
