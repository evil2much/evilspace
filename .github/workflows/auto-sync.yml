name: Auto Sync MoonTVPlus
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
env:
  VERCEL_ORG_ID: "evil2muchs-projects"
  VERCEL_PROJECT_ID: "team_bkCwm9PFBwL3IgSHjY5oid7Z"
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "AutoSyncBot"
          git config user.email "noreply@github.com"
      - name: Sync upstream to backup branch
        run: |
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git || true
          git fetch upstream main
          git branch -f backup upstream/main
          # 关键：删掉上游仓库带过来的 .github/workflows，避免推送workflow文件触发保护报错
          rm -rf .github/workflows
          git push origin backup --force
      - name: Checkout backup branch for build
        run: git checkout backup
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm 10.14.0
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm --version
      - name: Install dependencies & build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install vercel cli
        run: npm install -g vercel
      - name: Deploy to Vercel retry up to 3 times
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for i in {1..3}; do
            echo "===== Deployment attempt $i / 3 ====="
            vercel deploy --prod --token $VERCEL_TOKEN --org $VERCEL_ORG_ID --project $VERCEL_PROJECT_ID
            if [ $? -eq 0 ]; then
              echo "✅ Deploy success"
              exit 0
            fi
            echo "❌ Attempt $i failed, wait 15s for retry..."
            sleep 15
          done
          echo "❌ All 3 deployment attempts failed"
          exit 1
