name: Auto Sync MoonTVPlus 每6小时自动同步

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 配置Git身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 添加上游并拉取全量代码
        run: |
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git || true
          git fetch upstream main

      - name: 合并上游 main（保留自身修改）
        run: |
          git merge upstream/main --no-edit -X ours || true
          # 显式恢复自己的配置文件，确保不被上游覆盖
          git checkout origin/main -- .github/workflows/auto-sync.yml 2>/dev/null || true
          git checkout origin/main -- next.config.js 2>/dev/null || true
          git checkout origin/main -- vercel.json 2>/dev/null || true
          git commit -am "fix: preserve local configuration files" || true

      - name: 清理多余工作流文件
        run: |
          find .github/workflows -type f ! -name 'auto-sync.yml' -delete 2>/dev/null || true

      - name: 推送代码到主分支
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: true

      - name: 触发 Vercel 部署
        run: |
          echo "正在触发 Vercel Deploy Hook..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.vercel.com/v1/integrations/deploy/prj_qvkM9wqMZ3yjqodv2hZnoiqsqAJd/Ax6VpFiTwJ")
          echo "HTTP状态码: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "警告: Vercel Hook 返回异常状态码 $HTTP_CODE，请检查 Hook URL 是否有效"
          fi
        continue-on-error: true
