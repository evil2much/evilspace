name: Auto Sync MoonTVPlus
# 触发规则：每6小时自动执行，同时支持页面手动点击运行
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 权限：仅授予仓库读写，无多余权限
permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 拉取你evilspace仓库完整代码
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 设置git提交用户信息
      - name: Configure git
        run: |
          git config user.name "AutoSyncBot"
          git config user.email "noreply@github.com"

      # 核心同步步骤：拉取上游MoonTVPlus，删除上游workflow目录，推送backup分支
      - name: Sync upstream & strip workflow files
        run: |
          git remote add upstream https://github.com/mtvpls/MoonTVPlus.git || true
          git fetch upstream main
          # 基于上游main新建backup分支
          git checkout -b backup upstream/main
          # 删除上游仓库自带的github workflow，规避Github推送保护拦截
          rm -rf .github/workflows
          # 将删除操作写入新git提交（关键：不能只删本地文件，必须生成新commit）
          git add .
          git commit -m "remove upstream workflow files to bypass github protection"
          # 强制推送到远端backup分支
          git push origin backup --force

      # 切换到backup分支，准备构建
      - name: Checkout backup
        run: git checkout backup

      # 先安装pnpm 10.14.0，官方action，自动配置PATH
      - name: Install pnpm 10.14.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      # 再安装Node22
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 安装依赖并执行项目构建
      - name: Install deps & build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # 全局安装Vercel CLI
      - name: Install Vercel CLI
        run: npm install -g vercel

      # =========【修复】增加 --scope，project改为evilspace =========
      - name: Deploy to Vercel (retry 3 times)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for i in {1..3}; do
            echo "===== Deployment attempt $i / 3 ====="
            vercel deploy --prod --token $VERCEL_TOKEN --scope evil2muchs-projects --project evilspace
            if [ $? -eq 0 ]; then
              echo "✅ Deploy success"
              exit 0
            fi
            echo "❌ Attempt $i failed, wait 15s..."
            sleep 15
          done
          echo "❌ All deployment attempts failed"
          exit 1
